<main class="item-create-shell">
  <header class="item-create-header">
    <div>
      <p class="eyebrow">Inventario</p>
      <h1>Nuevo ítem</h1>
      <p>Crea una ficha manual. Solo el nombre es obligatorio; completa los demás datos cuando los necesites.</p>
    </div>
    <a mat-stroked-button routerLink="/photos/inbox"><mat-icon>photo_camera</mat-icon>Crear desde fotografías</a>
    <a mat-button routerLink="/inventory">
      <mat-icon>arrow_back</mat-icon>
      Inventario
    </a>
  </header>

  @if (loading()) {
    <section class="state-panel">
      <mat-progress-spinner mode="indeterminate" diameter="44" />
      <span>Cargando formulario...</span>
    </section>
  } @else {
    @if (error()) {
      <section class="state-panel error">
        <mat-icon>warning</mat-icon>
        <span>{{ error() }}</span>
      </section>
    }

    <mat-card class="create-card">
<app-item-editor [value]="form()" [options]="options()" [classOptions]="itemClassOptions()" [subtypeOptions]="itemSubtypeOptions()" [boxes]="boxOptions()" [conditions]="conditionOptions()" [fields]="propertyFields()" [classLabel]="selectedItemClass() ? inventoryModeLabel(selectedItemClass()!.inventoryMode) : ''" (patch)="patchForm($event)" (classChange)="setItemClassId($event)" (subtypeChange)="setItemSubtypeId($event)"  />
      <div class="form-actions">
        <a mat-button routerLink="/inventory">Cancelar</a>
        <button mat-flat-button type="button" (click)="createItem()" [disabled]="saving()">
          <mat-icon>save</mat-icon>
          {{ saving() ? 'Creando...' : 'Crear ítem' }}
        </button>
      </div>
    </mat-card>
  }
</main>
