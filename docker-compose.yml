services:
  inventario:
    build: .
    container_name: inventario
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      Access__Enabled: "${JUNKYARD_ACCESS_ENABLED:-true}"
      Access__RequireHttps: "${JUNKYARD_REQUIRE_HTTPS:-true}"
    volumes:
      - inventario-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inventario-data:
